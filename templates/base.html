<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}xdadwal.in{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/css/output.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>

  {% block head %}{% endblock %}
</head>
<body class="bg-background text-on-background font-body-md text-body-md overflow-x-hidden">

<!-- ─── Nav ────────────────────────────────────────────────────────────────── -->
<header x-data="{ open: false }"
        class="fixed top-0 w-full z-50 bg-background/80 backdrop-blur-md border-b border-outline-variant">
  <div class="max-w-container-max mx-auto px-gutter py-4 flex justify-between items-center">

    <a href="/" class="font-label-caps text-label-caps tracking-widest text-primary uppercase">
      XDADWAL.IN
    </a>

    <nav class="hidden md:flex items-center gap-8">
      <a href="/#experience"
         class="font-label-caps text-label-caps uppercase {% if active_page == 'home' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary transition-colors duration-200{% endif %}">
        Experience
      </a>
      <a href="/projects"
         class="font-label-caps text-label-caps uppercase {% if active_page == 'projects' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary transition-colors duration-200{% endif %}">
        Projects
      </a>
      <a href="/blog"
         class="font-label-caps text-label-caps uppercase {% if active_page == 'blog' %}text-primary font-bold border-b-2 border-primary pb-1{% else %}text-on-surface-variant hover:text-primary transition-colors duration-200{% endif %}">
        Blog
      </a>
    </nav>

    <div class="flex items-center gap-4">
      <a href="/static/resume.pdf" target="_blank"
         class="hidden md:block border border-primary text-primary px-6 py-2 font-label-caps text-label-caps uppercase font-bold rounded-none hover:bg-primary hover:text-background transition-all">
        Resume
      </a>
      <button @click="open = !open"
              class="md:hidden text-primary p-1"
              aria-label="Toggle menu">
        <span class="material-symbols-outlined" x-text="open ? 'close' : 'menu'">menu</span>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div x-show="open"
       x-transition:enter="transition duration-150"
       x-transition:enter-start="opacity-0 -translate-y-2"
       x-transition:enter-end="opacity-100 translate-y-0"
       @click.outside="open = false"
       class="md:hidden border-t border-outline-variant bg-background">
    <div class="px-gutter py-6 flex flex-col gap-6">
      <a href="/#experience" @click="open = false"
         class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase">Experience</a>
      <a href="/projects" @click="open = false"
         class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase">Projects</a>
      <a href="/blog" @click="open = false"
         class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase">Blog</a>
      <a href="/static/resume.pdf" target="_blank"
         class="font-label-caps text-label-caps text-primary uppercase">Resume</a>
    </div>
  </div>
</header>

<!-- ─── Page content ─────────────────────────────────────────────────────── -->
{% block content %}{% endblock %}

<!-- ─── Footer ──────────────────────────────────────────────────────────── -->
<footer class="w-full py-16 px-gutter border-t border-outline-variant">
  <div class="max-w-container-max mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
    <div class="flex flex-col items-center md:items-start gap-2">
      <span class="font-label-caps text-label-caps text-primary tracking-widest uppercase">XDADWAL.IN</span>
      <span class="font-code-sm text-code-sm text-on-surface-variant/40 uppercase tracking-widest">
        Built with FastAPI, Alpine.js, and Tailwind CSS
      </span>
    </div>
    <div class="flex gap-12">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer"
         class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase">GitHub</a>
      <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"
         class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase">LinkedIn</a>
      <a href="mailto:hello@xdadwal.in"
         class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase">Email</a>
    </div>
  </div>
</footer>

</body>
</html>
